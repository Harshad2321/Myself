    <!-- Set theme before first paint to avoid a flash. Charcoal dark is the
         default direction; light swaps to warm paper with black shadows. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ha-theme");
          if (t !== "dark" && t !== "light") {
            t = "dark";
          }
          document.documentElement.classList.remove("dark", "light");
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
