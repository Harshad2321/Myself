    <!-- Set theme before first paint to avoid a flash. Light is the default
         direction; dark swaps flat tones for deep saturated ones. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ha-theme");
          if (t !== "dark" && t !== "light") {
            t = "light";
          }
          document.documentElement.classList.remove("dark", "light");
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
